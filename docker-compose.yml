version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: triple_c_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YOUR_PASSWORD_HERE
      POSTGRES_DB: triple_c
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - triple_c_network

  # Next.js Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: triple_c_app
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:YOUR_PASSWORD_HERE@postgres:5432/triple_c?schema=public
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=NEXTAUTH_SECRET_REMOVED
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - triple_c_network

  # pgAdmin - Web UI for PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: triple_c_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ADMIN_PASSWORD_REMOVED
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - triple_c_network

volumes:
  postgres_data:

networks:
  triple_c_network:
    driver: bridge
