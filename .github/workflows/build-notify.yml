name: Build & Slack Notify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Record start time
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        continue-on-error: true

      - name: Calculate duration
        id: duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.start.outputs.time }}))
          echo "seconds=${DURATION}s" >> $GITHUB_OUTPUT

      - name: Send Success to Slack
        if: steps.build.outcome == 'success'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA=${SHORT_SHA:0:7}

          curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-type: application/json' \
          -d "{
            \"text\": \":white_check_mark: *Build Successful*\n\n*Status:* Ready\n*Duration:* ${{ steps.duration.outputs.seconds }}\n*Environment:* Production\n\n*Source*\n\`${{ github.ref_name }}\`\n\`${SHORT_SHA}\` ${{ github.event.head_commit.message }}\n\n*Author:* ${{ github.actor }}\n\n<https://triple-c.vercel.app|:link: Live Site>  |  <${{ github.event.head_commit.url }}|:octocat: GitHub>\"
          }"

      - name: Send Failure to Slack
        if: steps.build.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA=${SHORT_SHA:0:7}

          # ANSI 색상 코드 제거 후 에러 부분 추출
          ERROR_LOG=$(cat build.log | sed 's/\x1b\[[0-9;]*m//g' | grep -A 30 -m 1 "Failed to compile\|Error:" | head -25 | jq -Rs .)
          ERROR_LOG=${ERROR_LOG:1:-1}

          curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-type: application/json' \
          -d "{
            \"text\": \":x: *Build Failed*\n\n*Status:* Error\n*Duration:* ${{ steps.duration.outputs.seconds }}\n*Environment:* Production\n\n*Source*\n\`${{ github.ref_name }}\`\n\`${SHORT_SHA}\` ${{ github.event.head_commit.message }}\n\n*Author:* ${{ github.actor }}\n\n*Error Log:*\n\`\`\`${ERROR_LOG}\`\`\`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|:octocat: GitHub Actions 상세 보기>\"
          }"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
