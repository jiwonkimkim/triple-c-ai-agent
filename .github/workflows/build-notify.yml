name: Build & Slack Notify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      error_log: ${{ steps.build.outputs.error_log }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        id: build
        run: |
          set +e
          OUTPUT=$(npm run build 2>&1)
          EXIT_CODE=$?

          # 에러 로그 저장 (마지막 30줄)
          ERROR_LOG=$(echo "$OUTPUT" | tail -30 | tr '\n' '\\n' | sed 's/"/\\"/g')
          echo "error_log=$ERROR_LOG" >> $GITHUB_OUTPUT

          # 전체 로그 출력 (Actions에서 볼 수 있도록)
          echo "$OUTPUT"

          exit $EXIT_CODE

  notify-success:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Send Success to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-type: application/json' \
          -d '{
            "text": ":white_check_mark: *빌드 성공*\n\n*커밋:* `${{ github.event.head_commit.message }}`\n*브랜치:* `${{ github.ref_name }}`\n*작성자:* ${{ github.actor }}\n\n<${{ github.event.head_commit.url }}|GitHub에서 보기>"
          }'

  notify-failure:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    steps:
      - name: Send Failure to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          ERROR_LOG: ${{ needs.build.outputs.error_log }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-type: application/json' \
          -d "{
            \"text\": \":x: *빌드 실패*\n\n*커밋:* \`${{ github.event.head_commit.message }}\`\n*브랜치:* \`${{ github.ref_name }}\`\n*작성자:* ${{ github.actor }}\n\n*에러 로그:*\n\`\`\`$ERROR_LOG\`\`\`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions에서 상세 보기>\"
          }"
