name: Build & Slack Notify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Record start time
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        continue-on-error: true

      - name: Calculate duration
        id: duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.start.outputs.time }}))
          echo "seconds=${DURATION}s" >> $GITHUB_OUTPUT

      - name: Send Success to Slack
        if: steps.build.outcome == 'success'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA=${SHORT_SHA:0:7}

          curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-type: application/json' \
          -d "{
            \"attachments\": [{
              \"color\": \"#22c55e\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"✅ Build Successful\", \"emoji\": true}
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Status*\n🟢 Ready\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Duration*\n⏱️ ${{ steps.duration.outputs.seconds }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment*\n🚀 Production\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Author*\n👤 ${{ github.actor }}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Source*\n\`${{ github.ref_name }}\` · \`${SHORT_SHA}\`\n${{ github.event.head_commit.message }}\"}
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🌐 Live Site\"}, \"url\": \"https://triple-c.vercel.app\"},
                    {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"📂 GitHub\"}, \"url\": \"${{ github.event.head_commit.url }}\"}
                  ]
                }
              ]
            }]
          }"

      - name: Send Failure to Slack
        if: steps.build.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA=${SHORT_SHA:0:7}

          # ANSI 색상 코드 제거 후 에러 부분 추출
          ERROR_LOG=$(cat build.log | sed 's/\x1b\[[0-9;]*m//g' | grep -A 30 -m 1 "Failed to compile\|Error:" | head -25 | jq -Rs .)
          ERROR_LOG=${ERROR_LOG:1:-1}

          curl -X POST "$SLACK_WEBHOOK" \
          -H 'Content-type: application/json' \
          -d "{
            \"attachments\": [{
              \"color\": \"#ef4444\",
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"❌ Build Failed\", \"emoji\": true}
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    {\"type\": \"mrkdwn\", \"text\": \"*Status*\n🔴 Error\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Duration*\n⏱️ ${{ steps.duration.outputs.seconds }}\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Environment*\n🚀 Production\"},
                    {\"type\": \"mrkdwn\", \"text\": \"*Author*\n👤 ${{ github.actor }}\"}
                  ]
                },
                {
                  \"type\": \"section\",
                  \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Source*\n\`${{ github.ref_name }}\` · \`${SHORT_SHA}\`\n${{ github.event.head_commit.message }}\"}
                },
                {
                  \"type\": \"section\",
                  \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Error Log*\n\`\`\`${ERROR_LOG}\`\`\`\"}
                },
                {
                  \"type\": \"actions\",
                  \"elements\": [
                    {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🔍 상세 보기\"}, \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"style\": \"danger\"}
                  ]
                }
              ]
            }]
          }"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
